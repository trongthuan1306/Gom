services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: web_gom
      POSTGRES_USER: web_gom
      POSTGRES_PASSWORD: web_gom_dev
    ports: ["5432:5432"]
    volumes:
      - web_gom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web_gom -d web_gom"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  web_gom_pgdata:
